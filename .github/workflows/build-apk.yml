name: Build HydroPulse Max APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CI: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Setup Project Assets & Install Dependencies
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js privacy-policy.html www/ || true
          npm init -y
          npm install --save --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor-community/admob@latest
          npx cap init "HydroPulse Max" "com.hydropulse.max.cleaner" --web-dir www
          npx cap add android

      - name: 5. Inject Android Permissions and AdMob App ID
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
          '''
          content = content.replace('</manifest>', permissions + '\n</manifest>')

          admob_meta = '''
                  <meta-data
                      android:name=\"com.google.android.gms.ads.APPLICATION_ID\"
                      android:value=\"ca-app-pub-5353448104363534~2186520413\"/>
          '''
          content = content.replace('</application>', admob_meta + '\n    </application>')

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Successfully configured AndroidManifest with Permissions and AdMob App ID!')
          "

      - name: 6. Sync Capacitor with Android Platform
        run: npx cap sync android

      - name: 7. Build Native Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroPulse-Max-Ready-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
