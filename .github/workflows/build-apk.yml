name: Build HydroPulse Max APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Scaffold Capacitor Android Project
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js privacy-policy.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "HydroPulse Max" "com.hydropulse.max.cleaner" --web-dir www
          npx cap add android

      - name: 6. Inject Permissions & AdMob App ID
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # إضافة الأذونات المطلوبة للمايكروفون والاهتزاز والإنترنت
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST
          # إضافة كود تطبيق أدموب المالي
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5353448104363534~2186520413"/>' $MANIFEST

      - name: 7. Sync Android Project
        run: npx cap sync android

      - name: 8. Compile Native Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroPulse-Max-Ready-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
