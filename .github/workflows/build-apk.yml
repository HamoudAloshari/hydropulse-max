name: Build HydroPulse Max APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CI: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Build Project & Fetch Offline Quran
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js privacy-policy.html www/ 2>/dev/null || true
          # جلب ملف سورة الملك ودمجه داخل التطبيق
          curl -L -s -o www/mulk.mp3 "https://server8.mp3quran.net/afs/067.mp3"
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "HydroPulse Max" "com.hydropulse.max.cleaner" --web-dir www
          npx cap add android

      - name: 5. Inject Android Permissions and AdMob ID
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f: c = f.read()
          perms = '<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n<uses-permission android:name=\"android.permission.VIBRATE\" />\n<uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n'
          c = c.replace('</manifest>', perms + '</manifest>')
          meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-5353448104363534~2186520413\"/>\n'
          c = c.replace('</application>', meta + '</application>')
          with open(p, 'w') as f: f.write(c)
          "

      - name: 6. Sync Android
        run: npx cap sync android

      - name: 7. Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: HydroPulse-Max-Ready-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
