name: Build HydroPulse Max APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Scaffold Project & Capacitor
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp privacy-policy.html www/ || true
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "HydroPulse Max" "com.hydropulse.max.cleaner" --web-dir www
          npx cap add android

      - name: 5. Inject Permissions and AdMob ID via Python
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              data = f.read()

          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
          '''
          data = data.replace('</manifest>', perms + '\n</manifest>')

          meta = '''
                  <meta-data
                      android:name=\"com.google.android.gms.ads.APPLICATION_ID\"
                      android:value=\"ca-app-pub-5353448104363534~2186520413\"/>
          '''
          data = data.replace('</application>', meta + '\n    </application>')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(data)
          print('Successfully injected Android permissions and AdMob App ID!')
          "

      - name: 6. Sync Capacitor Android
        run: npx cap sync android

      - name: 7. Compile Native Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroPulse-Max-Ready-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
